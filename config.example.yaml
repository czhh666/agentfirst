db_path: data/agentfirst.db
spec_dir: specs

users:
  sk-test: alice

models:
  claude-sonnet-4-5:
    input: 3.0
    output: 15.0
  gpt-5-mini:
    input: 0.25
    output: 2.0

pricing:
  miss: 0.0005
  hit: 0.00025

apis:
  weather:
    spec: examples/open-meteo.yaml
    base_url: https://api.open-meteo.com/v1/
    cache_ttl: 60
    cache_methods: [GET]
    slim_mode: strict
    include_fields:
      - current.temperature_2m
      - current.relative_humidity_2m
      - current.apparent_temperature
      - current_units.temperature_2m
      - current_units.apparent_temperature
    short_map:
      temperature_2m: t
      relative_humidity_2m: h
      apparent_temperature: at
